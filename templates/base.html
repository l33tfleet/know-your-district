<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ copy.site.name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/site.css">
  <script src="{{ htmx_src }}" defer></script>
</head>
<body{% if state and state.variant %} data-variant="{{ state.variant }}"{% endif %}>
  <header class="site-header">
    <a href="/" class="site-name">{{ copy.site.name }}</a>
    <span class="site-tagline">{{ copy.site.tagline }}</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ copy.site.footer }}</p>
  </footer>
</body>
</html>
