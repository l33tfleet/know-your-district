{# The place search, beside the number picker on home.html and on find.html. A plain form:
   it works without JavaScript. #}
{% set find = copy.home.find %}
<form class="place-search" role="search" action="/find" method="get">
  <label for="q">{{ find.label }}</label>
  <input type="search" id="q" name="q" value="{{ q or '' }}" maxlength="100">
  <button type="submit">{{ find.submit }}</button>
</form>
