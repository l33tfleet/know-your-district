# All wording on the pages, grouped by page and then by brief section.
# Templates hold no wording; they read it from here. Hawaiian place names use the
# ʻokina (U+02BB) and kahakō. Placeholders in braces are filled by app code.

site:
  name: Know Your District
  tagline: Hawaiʻi State House and Senate district briefs
  footer: >-
    Figures come only from published tables. The first source is the U.S. Census
    Bureau's American Community Survey 5-year estimates. Every figure is cited.

home:
  heading: Know Your District
  intro: >-
    Pick a Hawaiʻi State House or Senate district. Get a one-page brief you can
    print, with sources. It shows who lives there, how sure the numbers are, and
    which public programs may help.
  picker:
    legend: Choose a district
    chamber_label: Chamber
    chambers:
      house: House
      senate: Senate
    number_label: District number
    submit: Open the brief
  # The place search beside the picker, on the home page and on /find.
  find:
    label: Find a district by place
    submit: Find
    options_label: Matching places
    # One listbox option as you type; the option's name is the place alone.
    option_detail: "{island} · House District {house}"

not_found:
  title: Page not found
  heading: Page not found
  body: This page doesn't exist. The address may be mistyped, or the page may have moved.
  home_link: Go to the home page to pick a Hawaiʻi House or Senate district

find:
  title: "Find a district by place · Know Your District"
  heading: Find a district by place
  # {q} is what was typed, shown as typed.
  results: "Oʻahu places matching “{q}”:"
  house_link: House District {number}
  none: "No Oʻahu place matches “{q}”. Only Oʻahu places are listed so far."
  picker_hint: Or choose the district by its number.
  empty: Type the name of a place on Oʻahu, such as Kāneʻohe or Mōʻiliʻili.

brief:
  # {district} is the district's full name, e.g. "Hawaiʻi State House District 22".
  title: "{district} · Know Your District"
  # Shown only with ?preview=1, in place of a flagged section that failed; {name} is the
  # section's file name in words. Never printed.
  section_failed: "Preview: the {name} section could not be shown. The rest of the brief is unaffected."
  # Above a section that is shown on screen but left off the printout.
  screen_only: Not on the printout

sections:
  headline:
    map_label: District map
    map_table_caption: District map as a table
    map_district_heading: District
    map_islands_heading: Islands
    hawaii: Hawaiʻi
    boundary_label: "{heading}; {islands}"
    boundary_source: "District outline: {credit}."
    coastline_source: "Island coastlines: {credit}."
    # {vintage} is the pinned ACS vintage from config.toml; {plan} the district plan year.
    vintage_line: >-
      U.S. Census Bureau, American Community Survey 5-year estimates, {vintage}.
      District lines from the {plan} plan.

  figures:
    heading: Who lives here
    names:
      population: Total residents
      age_65_share: Share of residents age 65 and over
      median_household_income: Median household income
    multi_county: This district lies in more than one county.
    county_area: Share of the district's area in this county
    mapping_summary: County boundary sources and method
    mapping_source: State of Hawaiʻi official district boundaries and U.S. Census Bureau county boundaries
    state_label: "State of Hawaiʻi:"
    not_available: This figure is not available
    no_moe: no margin of error published
    # Opens a SNAP count line ("The count is 773 households; ±172; reliable") on the case
    # card and in the outreach table, so the line reads as a sentence (WO187).
    count_lead: The count is
    no_cv: none
    # Used by the outreach and SNAP tables (pinned by tests/regressions/test_wo136_*).
    no_row: No published figure in the fact table yet.
    # Shown in a figure's "Source and uncertainty" box when that figure has no published row.
    no_row_plain: No published figure for this place yet.
    # Shown once at the top of the section when none of the brief's figures has a row yet;
    # {vintage} is the pinned ACS vintage from config.toml.
    not_loaded: >-
      The figures for this district haven't been loaded yet. They will come from the
      U.S. Census Bureau, American Community Survey 5-year estimates, {vintage}.
    # Reliability in words, one per flag from app/analysis/reliability.py (thresholds in docs/data.md).
    reliability:
      reliable: reliable
      moderate: "moderate: use with care"
      caution: use with caution
      unavailable: This figure is not available
    # Sentence templates per figure kind (KINDS in app/brief_facts.py). Placeholders only:
    # every number comes from a Fact and is rendered by the template, never written here.
    # {reading} is one geography's figure with its margin of error and reliability word.
    count_sentence: "{geography} has {reading} residents"
    share_sentence: "In {geography}, {reading} of residents are age 65 and over"
    dollars_sentence: "The median household income in {geography} is {reading}"
    # Population is never compared (KINDS): the county and state counts are only shown.
    count_reference: "{name} has {reading}"
    comparison_clause: "{lead} {name}, {reading}"
    comparison_tail: ", {tail}"
    clause_separator: ". "
    sentence_end: "."
    companion_sentence: "Published count of residents age 65 and over in {geography}: {reading}."
    # A share's margin of error is in percentage points, not a percent of the share.
    moe_units:
      age_65_share: points
    count_unavailable: >-
      The number of residents age 65 and over is not yet published here. It is
      never computed from the share.
    # #30 comparison wording per kind, one per group from app/analysis/compare.py.
    # The reference figure goes between lead and tail.
    comparisons:
      share:
        higher:
          lead: That is a larger share than
        lower:
          lead: That is a smaller share than
        indeterminate:
          lead: That is about the same share as
          tail: within the margins of error
        caution:
          lead: "Use with caution. There is no comparison claim with"
        missing:
          lead: "Figures to compare are not available. No comparison claim with"
      dollars:
        higher:
          lead: That is higher than
        lower:
          lead: That is lower than
        indeterminate:
          lead: That is about the same as
          tail: within the margins of error
        caution:
          lead: "Use with caution. There is no comparison claim with"
        missing:
          lead: "Figures to compare are not available. No comparison claim with"
    source_summary: Source and margin of error
    check_figure: Check this figure
    check_links:
      table: Published table on data.census.gov
      api: Census API query (may require an API key)
      evidence: Saved copy of the source (see method above)
      district_source: District boundary source
      county_source: County boundary source
      mapping_file: The county area file we keep (see method above)
    fields:
      source: Source
      table_id: Table
      vintage: Vintage
      geography: Geography
      method: Method
      moe: Margin of error (90%)
      cv: Coefficient of variation
      endpoint: Data endpoint

  outreach:
    measure: "Households below poverty that say they got no SNAP: a sign for outreach"
    basis: "State of Hawaiʻi average per {chamber} district"
    caveat: >-
      These are households, not people. They are not an estimate of who is eligible.
      ACS uses national Census poverty thresholds, which differ from Hawaiʻi
      program guidelines. Survey answers undercount benefit receipt.
      The state reference is the average count per district in the same chamber.
      It is not a household rate. Gaps in district household totals can change
      this signal. The agency decides eligibility.
    program_url: https://humanservices.hawaii.gov/bessd/snap/
    groups:
      higher: Clearly higher than the state average per district
      indeterminate: No clear difference from the state average per district
      lower: Clearly lower than the state average per district
      caution: "Use with caution; no comparison claim"
      missing: Figures to compare are not available here

  # The opening outreach case (#286). The record's own words are in data/cases.yaml.
  case:
    title: "{population} · {program}"
    citation: "Source: {source}, table {table_id}, {vintage}, geography {geography}. Method: {method}."
    unavailable: >-
      No published reading is available for {district}, so this card shows no count.
      The next step still applies.
    known_label: What we know
    unknown_label: What we don't
    problems:
      geography: Place
      population: People
      program: Program
    gap_label: Kind of gap
    action_label: Action
    gaps:
      unused_appropriation: Unused funds
      eligible_nonparticipation: May not be signed up
      application_or_renewal_barrier: Hard to apply or renew
      underpayment: Paid too little
      redemption_or_expiration_loss: Benefits not used or lost
      service_capacity_or_fit: Service is full or a poor fit
    actions:
      targeted_information: Share facts with the group
      navigator_referral: Refer to a helper
      outreach_planning_lead: Outreach-planning lead
      agency_follow_up: Agency follow-up
    next_label: Next step
    official_label: official next step
    outreach_label: DHS SNAP outreach providers
    rule_checked: "Rule source checked {date}."
    evidence_link: County and state figures, and the source
    save_label: Save to folder

  # The save form on every card (#153): one button, an optional link to an existing folder.
  folder_save:
    label: Save to folder
    existing: Link to an existing folder (optional; leave blank to start a new folder)

  snap:
    brief:
      heading: Households in poverty that say they got no SNAP
      measure_note: >-
        ACS asks if a household got SNAP in the past 12 months. This is not current
        enrollment or eligibility. This published joint cell counts households with income
        under the poverty threshold that reported no Food Stamps/SNAP in that time.
      poverty_note: >-
        ACS uses national Census poverty thresholds. They are lower than the Hawaiʻi HHS
        poverty guidelines. This count does not decide who is eligible. It does not find
        households that could get SNAP but are not enrolled.
    heading: Households below poverty that say they got no SNAP
    units: households
    measure_note: >-
      ACS asks if a household got SNAP in the past 12 months. This is not current
      enrollment or eligibility. This published joint cell counts households with
      income below poverty that reported no Food Stamps/SNAP in that time.
    undercount_note: >-
      Survey answers undercount benefit receipt. A household that says it got none
      may still have had some.
    poverty_note: >-
      ACS uses national Census poverty thresholds. They are lower than the Hawaiʻi
      HHS poverty guidelines. This count does not decide who is eligible. It does
      not find households that could get SNAP but are not enrolled.
    referral_note: >-
      SNAP may help. DHS decides eligibility. Contact DHS or Aloha United Way 211
      for assistance.
    official_url: https://humanservices.hawaii.gov/bessd/snap/
    referral_url: https://auw211.org/

  # A fixed question; its answer reads the same SNAP result as the outreach card.
  snap_question:
    heading: Ask about this district
    question: >-
      How many households here have income under the poverty line and say they got
      no SNAP?
    submit: Show the answer
    answer_label: Answer
    caption: Published counts for the district, county and state
    estimate_label: Count and margin of error
    official_label: Official SNAP program page
    referral_label: Aloha United Way 211

  ask:
    heading: Ask about this district
    label: Ask about this district
    placeholder: What would you like to understand about this district?
    submit: Ask
    working: Looking for published figures…
    answer_label: Answer
    paused: Ask is paused. The published brief is still available.
    live_unavailable: Live Ask is unavailable. The published brief is still available.
    clarify: Which population did you mean?
    fixed_income: >-
      No published measure defines fixed income. Choose one of the populations that is
      measured on its own. Social Security and retirement income groups overlap. They
      are never added together. They do not show who is kūpuna or whether income is enough.
    unavailable: "{label} · {geography}: not available. No published figure in the fact table yet."
    reading: "{label} · {geography}: {value} ({moe}; {reliability})."
    citation: "Source: {source}, table {table_id}, variable {variable}, {vintage}, geography {geography}. Method: {method}."
    moe: "margin of error (90%): ±{value}"
    percentage_moe: "margin of error (90%): ±{value} percentage points"
    geography_labels:
      published: Published for district
      estimated: Built from published figures
      context: County/state context
    comparison: "{label} · {district} compared with {reference}: {conclusion}."
    comparisons:
      higher: Clearly higher
      lower: Clearly lower
      indeterminate: No clear difference within the margins of error
      caution: Use with caution; no comparison claim
      missing: Figures to compare are not available here
    refusals:
      individual: I can share facts on groups of people in the district. I cannot look up or guess facts about a person.
      partisan: I give nonpartisan facts on groups of people. I cannot give views on candidates, parties, votes or bills.
      eligibility: I cannot say who is eligible. Programs may help. The agency decides eligibility. Use the official program page or Aloha United Way 211 for help.
      unsupported: The published figures do not support that claim. No count or estimate of who is eligible is here.
      out_of_scope: I can help with the published district populations and outreach cases shown in this brief. Please choose one of those topics.
    options:
      population: Total residents
      age_65_share: Share of residents age 65 and over
      median_household_income: Median household income
      poverty_65_rate: Poverty rate, age 65 and over
      older_living_alone: Households with a person age 65 and over living alone
      social_security_households: Households that got Social Security in the past year
      retirement_households: Households that got retirement income in the past year
      below_poverty_no_snap: Households in poverty that say they got no SNAP

  profiles:
    heading: Program profiles
    official: Official program page
    referral: Aloha United Way 211
    jurisdiction: Governed by
    category: Program type
    unit: Assistance unit
    income_basis: Income basis
    income_period: Income period
    bases:
      census_poverty: The Census poverty line for the whole nation
      hawaii_hhs: Hawaiʻi HHS poverty guidelines
      smi: State median income
      ami: Area median income
      not_applicable: Does not apply
    periods:
      monthly: Monthly
      annual: Annual
      past_12_months: Past twelve months
      not_applicable: Does not apply
    conditions: Conditions
    exceptions: Exceptions
    availability_label: Intake status
    availability:
      open: Open
      closed: Closed
      waitlist: Waitlist
      paused: Paused
      unknown: Unknown
    unknown: Unknown
    enacted: Enactment date
    effective: Effective date
    applications: Opening date
    rules: Official rule source
    application: How to apply
    verified: Rule source last checked
    next_steps: Next steps for groups
    checked: Contact details checked
    owner: Refresh owner
    refresh: Refresh deadline
    statistics: People in the area
    limitations: These figures describe the people who live here. They do not estimate who is eligible or who is not taking part. Program rules and data on who takes part need a separate review.
    district: Published for district
    context: County/state context
    unavailable: This figure is not available
    missing: No matching published figure for this brief. Catalog figures are not shown.
    moe: "margin of error (90%): ±{value}"
    no_moe: no margin of error published
    reliability:
      reliable: reliable
      moderate: "moderate: use with care"
      caution: use with caution
      unavailable: This figure is not available
    citation: "Source: {source}, table {table_id}, variable {variable}, {vintage}, geography {geography}. Method: {method}."
    source: Published fact source
    permission: Dated reuse permission
    licence: Reuse licence evidence

  # Names, agencies, purposes and links come from data/programs.yaml.
  programs:
    heading: Programs that may help
    official_link: Official program page
    referral_link: Aloha United Way 211

# A district folder (#288). Its figures come from the case card, re-read on each render.
folders:
  title: "{name} · Know Your District"
  notice: Anyone with this link can open and edit this folder
  link_label: Link to this folder
  copy_link: Copy link
  copied: Link copied
  reopen: Reopen this folder's link
  open_office: Open the office folder
  empty: This folder has no saved cases.
  attention_heading: What needs attention
  attention_region: Needs attention
  attention_refresh: What needs attention?
  attention_empty: Nothing needs attention. All saved cases are done, or this folder has no saved cases.
  district_label: "Saved for {district}"
  priority_label: Priority
  reason_label: Reason, one line
  reason_hint: Optional, up to 200 characters. Do not name or describe a person.
  status_label: Status
  summary: "Priority is {priority}{reason}. Status is {status}."
  summary_reason: " ({reason})"
  priorities:
    high: High
    normal: Normal
    low: Low
  statuses:
    idea: Idea
    contacted: Contacted
    planned: Planned
    done: Done
  unknown_case: "Unknown case {value!r}. Valid values: {valid}."
  unknown_district: "Unknown district. Valid chambers: {valid}, each with its own district numbers."
  unknown_priority: "Unknown priority {value!r}. Valid values: {valid}."
  unknown_status: "Unknown status {value!r}. Valid values: {valid}."
  bad_reason: A reason is one line of 1 to 200 characters.
  no_store: Folders are not available here because the folder file could not be opened. Set KYD_FOLDERS_DB to choose another file outside the checkout.
  # Notes on a saved case (#289). A personal detail is always refused; no confirmation lifts it.
  notes_heading: Notes
  note_label: Add a note
  note_hint: Notes are about outreach and groups of people, not one resident.
  add_note: Add note
  checking_note: "Checking this note:"
  edit_note: Edit note
  edit_label: Edit this note
  update_note: Update note
  delete_note: Delete note
  confirm_statement: This note is about outreach and groups of people, not one resident.
  save_note: Save note
  cancel_note: Cancel
  no_notes: No notes yet.
  note_too_long: "A note is at most {limit:,} characters; this one has {count:,}. Shorten it to save."
  note_blank: A note needs words.
  note_control: A note cannot hold control characters. Remove them to save.
  note_personal: Personal phone numbers, emails and addresses are not kept here. Remove them to save.
  note_unconfirmed: This note was not confirmed as written. Check it again, then save.
  note_rate: "Too many changes in a short time. Try again in {seconds} seconds."
  no_secret: Notes are not available here because KYD_FOLDERS_SECRET is not set to at least 32 bytes.
  # Saving a card from any surface (#153); nothing is written when one of these is refused.
  unknown_fields: "Unknown form fields: {fields}. Valid fields: {valid}."
  district_twice: Give the district once, in the form or in the address, not both.
  mixed_selection: Save a case or a population and program match, not both.
  incomplete_match: A match needs both population_id and program_id.
  unknown_match: "Unknown match {population!r} · {program!r} for this district. Valid matches: {valid}."
  bad_folder: Unknown folder link. Paste the whole link of a folder (it ends in /f/ and 32 letters and digits), or leave it blank to start a new folder.
  nothing_to_save: Choose a case or a match to save into an existing folder.
  capacity: "{detail} Nothing was saved."
  match_gone: This saved match is no longer among the reviewed connections for this district, so no figure is shown. Use the official program page or Aloha United Way 211.

# Geography names, shared by the headline and the figures' citations.
geography:
  house: Hawaiʻi State House District {number}
  senate: Hawaiʻi State Senate District {number}
  state: State of Hawaiʻi

counties:
  "001": Hawaiʻi County
  "003": Honolulu County
  "007": Kauaʻi County
  "009": Maui County

# Ask uses recorded typed decisions here; live routing belongs to #184.
# No upstream prose, values, labels or comparison claims reach the renderer.
