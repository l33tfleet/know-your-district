name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned dependencies
        run: uv sync --locked
      - name: make check
        run: make check
      - name: Smoke test a running app
        run: |
          # CI uses synthetic facts in a temporary DB; deploy smoke uses the staged DB.
          export KYD_FACTS_DB="$(mktemp)"
          trap 'rm -f "$KYD_FACTS_DB"' EXIT
          python -c 'import os, pathlib, sqlite3; db = sqlite3.connect(os.environ["KYD_FACTS_DB"]); db.executescript(pathlib.Path("data/schema.sql").read_text()); db.executescript(pathlib.Path("tests/regressions/fixtures/wo120_smoke.sql").read_text()); db.commit(); db.close()'
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          # Stop the server however the step ends, so it stops holding uv's cache lock.
          cleanup() {
            step_status=$?
            trap - EXIT
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
            fi
            if wait "$server_pid"; then
              server_status=0
            else
              server_status=$?
            fi
            rm -f "$KYD_FACTS_DB"
            if [ "$step_status" -ne 0 ]; then
              exit "$step_status"
            fi
            # SIGTERM is expected when cleanup stops the background server.
            if [ "$server_status" -ne 0 ] && [ "$server_status" -ne 143 ]; then
              exit "$server_status"
            fi
          }
          trap cleanup EXIT
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          make smoke BASE_URL=http://127.0.0.1:8000

  regressions-append-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that existing regression tests are unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: |
          # Run the checker as it exists on the base branch, so a PR cannot loosen it.
          checker=.github/scripts/regressions_append_only.py
          if git cat-file -e "$BASE_SHA:$checker" 2>/dev/null; then
            git show "$BASE_SHA:$checker" > "$RUNNER_TEMP/regressions_append_only.py"
          else
            cp "$checker" "$RUNNER_TEMP/regressions_append_only.py"
          fi
          python "$RUNNER_TEMP/regressions_append_only.py" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$BRANCH"
