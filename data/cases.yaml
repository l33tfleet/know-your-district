    known:
      geography: published for this district, not shared out from a county
      population: one published joint cell (B22003_006), not built from separate totals
    unknown:
      program: Hawaiʻi household, deduction and nonfinancial rules are not in the survey
    action:
      kind: targeted_information
      note: where to apply and get free help applying
      steps:
        - label: Official SNAP page
          url: https://humanservices.hawaii.gov/bessd/snap/
        - label: Aloha United Way 211
          url: https://auw211.org/
    research: docs/research/benefit-program-access.md#snap-and-cofa
