# Outreach cases (#286). Validated at startup by app/cases.py, unknown fields rejected.
# A case holds words and links, never a figure: its count comes from the fact table.
# gap and kind are research terms; the card shows the words in app/copy.yaml.
cases:
  - id: snap_no_receipt
    population: below_poverty_no_snap
    program:
      name: SNAP
      agency: Hawaiʻi Department of Human Services
      url: https://humanservices.hawaii.gov/bessd/snap/
      rule_checked: 2026-10-28
    failure:
      gap: eligible_nonparticipation
      note: "not measured: survey receipt is an outreach signal"
    claim: >-
      A place to start: survey-reported receipt over the past 12 months is an outreach signal,
      not current enrollment.
    known:
      geography: The count is published for this district.
      population: A published joint cell, B22003_006, not built from separate totals.
    unknown:
      program: Hawaiʻi household, deduction and nonfinancial rules are not in the survey.
    action:
      kind: navigator_referral
      links:
        - label: Aloha United Way 211
          url: https://auw211.org/
    research: docs/research/benefit-program-access.md#snap-and-cofa
