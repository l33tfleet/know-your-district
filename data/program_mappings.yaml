  relevance: Public pre-K may help with early learning. Children under five are a wider group to reach. This is not a count of who meets the rules or who is not enrolled. The agency decides eligibility. Read the official FAQ and call Aloha United Way 211.
  observed_conditions: [Residents under five, from published age cells.]
  unobserved_conditions: ["Exact birth date within the dated school-year group, and enrollment priority rules.",
    "Which schools take part, if the schedule fits, and that there is no care before or after school.",
    How many seats are open and how many children are enrolled now.]
  claim: relevant_need
  review_status: pending
