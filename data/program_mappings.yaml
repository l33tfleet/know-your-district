# Offline relevance mappings, pending program-expert review. No eligibility model
# or comparable participation evidence is supplied, so no stronger claim is made.
# Population IDs resolve to the measure contract in populations.yaml; program IDs
# resolve to programs.yaml. The catalog retains official sources and the 211 route.
- population_id: below_poverty_no_snap
  program_id: snap
  relevance: >-
    SNAP may help with food costs. This joint survey count can guide outreach. It does
    not count those who meet the rules but lack aid. The agency decides eligibility.
    The catalog links to the official page and Aloha United Way 211.
  observed_conditions:
    - These households were below the national Census poverty line. They said they had no SNAP in the past 12 months.
  unobserved_conditions:
    - Current income under Hawaiʻi rules. Costs the rules let households deduct.
    - Who counts as part of the SNAP household. Rules beyond income.
    - Who gets SNAP now. The survey misses some past receipt.
  claim: relevant_need
  review_status: pending

- population_id: disability
  program_id: hawaii-able
  relevance: >-
    Hawaiʻi ABLE may help people with a disability save money for costs linked to that
    disability. This survey group is people to reach. It does not count who meets the
    rules or who lacks aid. Program-expert review is pending. The agency decides eligibility.
  observed_conditions:
    - People told the survey they have a disability. The count leaves out people on active duty and people in places like prisons or nursing homes.
  unobserved_conditions:
    - "Disability onset: the age when it began. Federal rules set an age limit. Current age is not the age it began."
    - Who gets a disability benefit that meets the rules. Or who has a signed form, a certification, that shows it.
    - Who has an account now, who can save, and how benefits affect each other.
    - Current Hawaiʻi enrollment, fees and incentives. We have not checked these.
  claim: relevant_need
  review_status: pending

# Connection based on the supplied EOEL FAQ verification of 2026-11-08; expert review pending.
- population_id: children_under_5
