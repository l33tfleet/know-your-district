# Published scalar cells only; rent components and poverty brackets remain separate.
name: U.S. Census Bureau ACS 5-year
url: https://api.census.gov/data/2024/acs/acs5
licence: U.S. public domain, federal government work (17 U.S.C. § 105)
geography: {state: "15", district_plan: 2022, county_codes: ["001", "003", "007", "009"]}
vintage: 2020–2024
method: published estimate and 90% margin of error
indicators:
  - id: population
    endpoint: detailed
    build: true
    variables:
      - {id: B01003_001E, unit: people, display_name: "Total population",
         expected_label: "Estimate!!Total"}
  - id: age_65_share
    endpoint: profile
    build: true
    variables:
      - {id: DP05_0024PE, unit: percent, display_name: "Share of residents age 65 and over",
         expected_label: "Percent!!SEX AND AGE!!Total population!!65 years and over"}
  - id: median_household_income
    endpoint: detailed
    build: true
    variables:
      - {id: B19013_001E, unit: dollars, display_name: "Median household income",
         expected_label: "Estimate!!Median household income in the past 12 months (in 2024 inflation-adjusted dollars)"}
  - id: poverty_rate
    endpoint: subject
    build: false
    variables:
      - {id: S1701_C03_001E, unit: percent, display_name: "Poverty rate",
         expected_label: "Estimate!!Percent below poverty level!!Population for whom poverty status is determined"}
  - id: poverty_65_rate
    endpoint: subject
    build: false
    variables:
      - {id: S1701_C03_010E, unit: percent, display_name: "Poverty rate, age 65 and over",
         expected_label: "Estimate!!Percent below poverty level!!Population for whom poverty status is determined!!AGE!!65 years and over"}
  - id: unemployment_rate
    endpoint: subject
    build: false
    variables:
      - {id: S2301_C04_001E, unit: percent, display_name: "Unemployment rate",
         expected_label: "Estimate!!Unemployment rate!!Population 16 years and over"}
  - id: snap_households
    endpoint: detailed
    build: false
    variables:
      - {id: B22010_002E, unit: households, display_name: "Households receiving SNAP",
         expected_label: "Estimate!!Total:!!Household received Food Stamps/SNAP in the past 12 months:"}
  - id: snap_share
    endpoint: subject
    build: false
    variables:
      - {id: S2201_C04_001E, unit: percent, display_name: "Share of households receiving SNAP",
         expected_label: "Estimate!!Percent households receiving food stamps/SNAP!!Households"}
  - id: social_security_households
    endpoint: detailed
    build: false
    variables:
      - {id: B19055_002E, unit: households, display_name: "Households with Social Security income",
         expected_label: "Estimate!!Total:!!With Social Security income"}
  - id: retirement_households
    endpoint: detailed
    build: false
    variables:
      - {id: B19059_002E, unit: households, display_name: "Households with retirement income",
         expected_label: "Estimate!!Total:!!With retirement income"}
  - id: rent_burden
    endpoint: profile
    build: false
    variables:
      - {id: DP04_0141PE, unit: percent, display_name: "Renters paying 30.0 to 34.9 percent of income on rent",
         expected_label: "Percent!!GROSS RENT AS A PERCENTAGE OF HOUSEHOLD INCOME (GRAPI)!!Occupied units paying rent (excluding units where GRAPI cannot be computed)!!30.0 to 34.9 percent"}
      - {id: DP04_0142PE, unit: percent, display_name: "Renters paying 35.0 percent or more of income on rent",
         expected_label: "Percent!!GROSS RENT AS A PERCENTAGE OF HOUSEHOLD INCOME (GRAPI)!!Occupied units paying rent (excluding units where GRAPI cannot be computed)!!35.0 percent or more"}
  - id: median_gross_rent
    endpoint: detailed
    build: false
    variables:
      - {id: B25064_001E, unit: dollars, display_name: "Median gross rent",
         expected_label: "Estimate!!Median gross rent"}
  - id: uninsured_rate
    endpoint: subject
    build: false
    variables:
      - {id: S2701_C05_001E, unit: percent, display_name: "Uninsured rate",
         expected_label: "Estimate!!Percent Uninsured!!Civilian noninstitutionalized population"}
  - id: disability_share
    endpoint: subject
    build: false
    variables:
      - {id: S1810_C03_001E, unit: percent, display_name: "Share with a disability",
         expected_label: "Estimate!!Percent with a disability!!Total civilian noninstitutionalized population"}
  - id: limited_english_share
    endpoint: subject
    build: false
    variables:
      - {id: S1602_C04_001E, unit: percent, display_name: "Limited-English households",
         expected_label: "Estimate!!Percent limited English-speaking households!!All households"}
  - id: no_vehicle_households
    endpoint: detailed
    build: false
    variables:
      - {id: B08201_002E, unit: households, display_name: "Households with no vehicle",
         expected_label: "Estimate!!Total:!!No vehicle available"}
  - id: poverty_ratio
    endpoint: detailed
    build: false
    variables:
      - {id: C17002_001E, unit: people, display_name: "Total population with poverty status determined",
         expected_label: "Estimate!!Total:"}
      - {id: C17002_002E, unit: people, display_name: "Income to poverty ratio under 0.50",
         expected_label: "Estimate!!Total:!!Under .50"}
      - {id: C17002_003E, unit: people, display_name: "Income to poverty ratio 0.50 to 0.99",
         expected_label: "Estimate!!Total:!!.50 to .99"}
      - {id: C17002_004E, unit: people, display_name: "Income to poverty ratio 1.00 to 1.24",
         expected_label: "Estimate!!Total:!!1.00 to 1.24"}
      - {id: C17002_005E, unit: people, display_name: "Income to poverty ratio 1.25 to 1.49",
         expected_label: "Estimate!!Total:!!1.25 to 1.49"}
      - {id: C17002_006E, unit: people, display_name: "Income to poverty ratio 1.50 to 1.84",
         expected_label: "Estimate!!Total:!!1.50 to 1.84"}
      - {id: C17002_007E, unit: people, display_name: "Income to poverty ratio 1.85 to 1.99",
         expected_label: "Estimate!!Total:!!1.85 to 1.99"}
      - {id: C17002_008E, unit: people, display_name: "Income to poverty ratio 2.00 and over",
         expected_label: "Estimate!!Total:!!2.00 and over"}
